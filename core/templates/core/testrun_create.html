{% extends "base.html" %}

{% block title %}New Run - LLM Evaluation Workbench{% endblock %}

{% block content %}
<h1>Create Test Run</h1>
<p>Select a test case version, prompt template, and model. The run will execute in the background.</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <p style="margin-top: 1rem;">
        <button type="submit" class="btn">Start Run</button>
        <a href="{% url 'core:testrun_list' %}" class="btn btn-secondary">Cancel</a>
    </p>
</form>
{% endblock %}
