{% extends "base.html" %}

{% block title %}Create Test Case - LLM Evaluation Workbench{% endblock %}

{% block content %}
<h1>Create Test Case</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <p style="margin-top: 1rem;">
        <button type="submit" class="btn">Create</button>
        <a href="{% url 'core:testcase_list' %}" class="btn btn-secondary">Cancel</a>
    </p>
</form>
{% endblock %}
