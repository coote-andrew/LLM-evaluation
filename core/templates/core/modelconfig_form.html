{% extends "base.html" %}

{% block title %}{% if object %}Edit{% else %}Add{% endif %} Model - LLM Evaluation Workbench{% endblock %}

{% block content %}
<h1>{% if object %}Edit{% else %}Add{% endif %} Model Configuration</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <p style="margin-top: 1rem;">
        <button type="submit" class="btn">Save</button>
        <a href="{% url 'core:modelconfig_list' %}" class="btn btn-secondary">Cancel</a>
    </p>
</form>
{% endblock %}
