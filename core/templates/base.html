<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LLM Evaluation Workbench{% endblock %}</title>
    <style>
        :root {
            --bg: #0f1419;
            --surface: #1a2332;
            --border: #2d3a4f;
            --text: #e6edf3;
            --muted: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #79b8ff;
            --success: #3fb950;
            --error: #f85149;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            line-height: 1.5;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
        nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
        }
        nav a {
            color: var(--accent);
            text-decoration: none;
            margin-right: 1.5rem;
        }
        nav a:hover { color: var(--accent-hover); }
        main { padding: 2rem 0; }
        h1 { font-size: 1.75rem; margin-top: 0; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th { background: rgba(0,0,0,0.2); font-weight: 600; }
        tr:hover { background: rgba(255,255,255,0.03); }
        .btn {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: var(--accent);
            color: var(--bg) !important;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn-secondary { background: var(--border); }
        .btn-secondary:hover { background: #3d4f6a; }
        form label { display: block; margin-top: 0.75rem; }
        form input[type="text"], form input[type="number"], form input[type="url"],
        form input[type="password"], form select, form textarea {
            width: 100%;
            max-width: 400px;
            padding: 0.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
        }
        .messages { margin-bottom: 1rem; }
        .message { padding: 0.75rem; border-radius: 6px; margin-bottom: 0.5rem; }
        .message.success { background: rgba(63,185,80,0.2); color: var(--success); }
        .message.error { background: rgba(248,81,73,0.2); color: var(--error); }
        .badge {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            font-size: 0.75rem;
            border-radius: 4px;
        }
        .badge-pending { background: #6e7681; }
        .badge-running { background: #1f6feb; }
        .badge-completed { background: var(--success); }
        .badge-failed { background: var(--error); }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'core:dashboard' %}">Dashboard</a>
        <a href="{% url 'core:testcase_list' %}">Test Cases</a>
        <a href="{% url 'core:testcase_upload' %}">Upload CSV</a>
        <a href="{% url 'core:modelconfig_list' %}">Models</a>
        <a href="{% url 'core:testrun_list' %}">Runs</a>
        <a href="{% url 'core:testrun_create' %}">New Run</a>
        {% if user.is_authenticated %}
            <a href="{% url 'admin:index' %}">Admin</a>
            <a href="{% url 'logout' %}">Logout ({{ user.username }})</a>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
        {% endif %}
    </nav>
    <main class="container">
        {% if messages %}
        <div class="messages">
            {% for m in messages %}
            <div class="message {{ m.tags }}">{{ m }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
