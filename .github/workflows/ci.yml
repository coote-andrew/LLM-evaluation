name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # Django test suite. Uses config.test_settings (SQLite in-memory) so the job
  # does not need Postgres / Redis services.
  #
  # Covers:
  #   - core/ unit + integration tests
  #   - core/services/agents_client.py (against an httpx.MockTransport)
  #   - core/management/commands/sync_agent_registry.py (against a mocked
  #     agents admin API)
  #
  # The real agents service is a separate deployment in its own git repo
  # (see docs/AGENTS_SERVICE_GUIDE.md); it is NOT built or booted here.
  # ───────────────────────────────────────────────────────────────────────────
  django-tests:
    name: Django tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip
      - run: pip install -r requirements.txt
      - run: python -m django --version
      - name: Run Django tests
        run: python manage.py test --settings=config.test_settings

  # ───────────────────────────────────────────────────────────────────────────
  # Build the Django web image. Does not push — just proves the Dockerfile is
  # sound.
  # ───────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Django image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: llm-evaluation-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
