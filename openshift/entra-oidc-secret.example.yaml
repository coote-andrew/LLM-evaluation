# Copy this file to entra-oidc-secret.yaml, replace every CHANGE_ME value, then:
#   oc apply -f entra-oidc-secret.yaml -n <namespace>
#
# Do not commit the copied file. `stringData` lets OpenShift base64-encode the
# values when it creates the Secret.
apiVersion: v1
kind: Secret
metadata:
  name: cicada-entra-oidc
type: Opaque
stringData:
  # Application (client) ID from Entra App registrations > Overview.
  ENTRA_CLIENT_ID: "CHANGE_ME_CLIENT_ID"
  # Directory (tenant) ID from Entra App registrations > Overview.
  ENTRA_TENANT_ID: "CHANGE_ME_TENANT_ID"
  # Client-secret *Value*, not its Secret ID.
  ENTRA_CLIENT_SECRET: "CHANGE_ME_CLIENT_SECRET_VALUE"
  # Object ID of the group approved for Cicada.
  ENTRA_APPROVED_GROUP_ID: "CHANGE_ME_GROUP_OBJECT_ID"

  # Enables the SSO button and callback URLs. Local password login remains on.
  ENTRA_OIDC_ENABLED: "true"
  # OpenShift router terminates TLS and sends X-Forwarded-Proto.
  DJANGO_TRUST_X_FORWARDED_PROTO: "true"
  ENTRA_OIDC_LOG_LEVEL: "INFO"
  ENTRA_OIDC_TIMEOUT_SECONDS: "10"
  ENTRA_OIDC_REDIRECT_REQUIRE_HTTPS: "true"
